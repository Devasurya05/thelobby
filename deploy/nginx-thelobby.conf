# Nginx site for The Lobby. Installed by deploy/setup-server.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # replaced by the real name when HTTPS is added

    # Only the public/ folder is reachable from the internet. .env, app/, vendor/ are outside it.
    root /var/www/thelobby/public;
    index index.php;

    # A little above the app's 10 MB vault limit (PHP's limits are set in setup-server.sh to match).
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only index.php may run as PHP. Any other .php file is a 404 (a stray uploaded file can never execute).
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.env, .git) are never served. .well-known is allowed for the HTTPS certificate check.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
